# Durcissement post-audit : bloque les fichiers de config/secrets qui
# vivent dans le docroot (COPY . /var/www/html/ au build).
<FilesMatch "\.(env|git|gitignore|sql|bak|log|ini|yml|yaml)$">
    Require all denied
</FilesMatch>

<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>

# Deny-all générique sur tout fichier commençant par un point. FilesMatch
# ne matche que le nom du fichier final (basename), pas les segments du
# chemin : /.well-known/acme-challenge/TOKEN n'est pas affecté puisque
# TOKEN ne commence pas par un point. Robuste face à un nouveau nom de
# fichier caché (.env.local, .env.save, etc.) plutôt que de dépendre
# d'une liste de motifs à maintenir à jour.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
